<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2962FF 0%, #BA68C8 50%, #FF5233 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* Noise texture overlay */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.15;
    }
    /* Animated gradient orbs */
    body::after {
      content: '';
      position: absolute;
      top: 30%;
      right: 20%;
      width: 400px;
      height: 400px;
      background: rgba(255, 82, 51, 0.3);
      border-radius: 50%;
      filter: blur(80px);
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px;
    }
    .logo {
      font-size: 72px;
      color: white;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
      font-weight: 500;
    }
    .logo .italic {
      font-style: italic;
      font-weight: 400;
    }
    .symbol {
      color: rgba(255, 255, 255, 0.9);
      margin-left: 10px;
    }
    .tagline {
      font-size: 36px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 30px;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="italic">vista</span><span class="symbol">₊˚⊹</span>
    </div>
    <div class="tagline">Research for the Future Internet</div>
    <div class="subtitle">
      Original analysis on DeFi, L2s, AI agents, and emerging crypto trends
    </div>
  </div>
</body>
</html>
